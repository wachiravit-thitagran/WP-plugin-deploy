name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Resolver and validator smoke test
        run: php tests/smoke.php
      - name: Ability registration smoke test
        run: php tests/abilities-smoke.php
      - name: Rollback smoke test
        run: php tests/rollback-smoke.php
      - name: Deployer integration smoke test
        run: php tests/deployer-integration-smoke.php
      - name: Native upgrader smoke test
        run: php tests/native-upgrader-smoke.php
